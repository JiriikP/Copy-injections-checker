<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 330px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 15px;
            margin: 0;
            background: #fdfdfd;
            color: #222;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .header-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .header h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .header-btn {
            display: inline-flex;
            align-items: center;
            background: #e9ecef;
            border: 1px solid #ced4da;
            color: #333;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.2;
            padding: 4px 8px;
            border-radius: 4px;
            text-decoration: none;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .header-btn:hover { background: #dee2e6; }
        .header-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .2s;
            border-radius: 22px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #2e7d32; }
        input:checked + .slider:before { transform: translateX(18px); }

        .site-control {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f3f5;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .site-info {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 10px;
        }
        .site-domain {
            font-weight: 600;
            color: #444;
            display: block;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .default-off-control {
            margin-bottom: 14px;
            padding: 4px 2px;
        }
        .default-off-control label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #444;
            cursor: pointer;
            user-select: none;
        }

        .section { margin-bottom: 14px; }
        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .btn-toggle-list {
            width: 100%;
            padding: 8px 10px;
            background: #e9ecef;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #333;
        }
        .btn-toggle-list:hover { background: #dee2e6; }
        
        .injections-list {
            display: none;
            margin-top: 8px;
            max-height: 180px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.4;
        }
        .injection-item {
            padding: 6px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }
        .injection-item:last-child { border-bottom: none; }
        
        .injection-content {
            display: flex;
            align-items: flex-start;
            flex-grow: 1;
            padding-right: 8px;
            word-break: break-word;
        }

        .badges-wrap {
            display: grid;
            grid-template-columns: repeat(4, max-content);
            gap: 4px;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .type-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 18px;
            height: 18px;
            background: #d32f2f;
            color: #fff;
            border-radius: 50%;
            font-size: 10px;
            font-weight: bold;
            font-family: sans-serif;
            cursor: help;
        }
        
        .injection-text { color: #b71c1c; }

        .scroll-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #007bff;
            padding: 2px 4px;
            margin-top: -2px;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.2s;
            flex-shrink: 0;
        }
        .scroll-btn:hover {
            opacity: 1;
            transform: scale(1.1) translate(1px, -1px);
        }
        
        .empty-msg {
            color: #777;
            font-family: sans-serif;
            text-align: center;
            padding: 10px 0;
        }
        .disabled-overlay { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <h2>Copy Injection Checker</h2>
            <div class="header-actions">
                <button class="header-btn" id="refreshBtn">Znovu načíst</button>
                <a class="header-btn" href="https://github.com/JiriikP/Copy-injections-checker" target="_blank" rel="noopener noreferrer" title="Otevřít repozitář na GitHubu">GitHub repo</a>
                <a class="header-btn" href="https://JiriikP.github.io/Copy-injections-checker/" target="_blank" rel="noopener noreferrer" title="Otevřít testovací stránku">Testování</a>
            </div>
        </div>
        <label class="switch" title="Globálně zapnout / vypnout doplněk">
            <input type="checkbox" id="globalToggle">
            <span class="slider"></span>
        </label>
    </div>

    <div id="controlsWrapper">
        <div class="site-control">
            <div class="site-info">
                Aktivní na této stránce:
                <span class="site-domain" id="currentDomain">načítám...</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="siteToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="default-off-control">
            <label title="Na nových nenastavených webech zůstane doplněk vypnutý, dokud ho pro daný web ručně nepovolíš">
                <input type="checkbox" id="defaultOffCheckbox">
                Defaultně vypnout na nových stránkách
            </label>
        </div>

        <div class="section">
            <div class="section-title">Akce po nalezení</div>
            <div class="radio-group">
                <label>
                    <input type="radio" name="action" value="highlight"> Zvýraznit text
                </label>
                <label>
                    <input type="radio" name="action" value="remove"> Rovnou odstranit
                </label>
            </div>
        </div>

        <button class="btn-toggle-list" id="toggleListBtn">
            <span id="listBtnText">Zobrazit detekované texty (0)</span>
            <span id="arrowIcon">▼</span>
        </button>
        
        <div class="injections-list" id="injectionsList">
            <div class="empty-msg">Na této stránce nebyly nalezeny žádné skryté texty.</div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
